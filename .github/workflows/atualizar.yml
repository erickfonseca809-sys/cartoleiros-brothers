name: Atualizar dados do Cartola

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testar API alternativa KartolaFC
        run: |
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const data = JSON.parse(fs.readFileSync('data/liga.json','utf8'));
          const team = (data.times || []).find(t => t.id);
          if (!team) { console.log('Sem ID de time salvo; teste ignorado.'); process.exit(0); }
          const rodada = data.rodadaAtual || 1;
          const url = `https://api.kartolafc.com.br/time/id/${team.id}/${rodada}`;
          try {
            const res = await fetch(url, {headers:{'User-Agent':'cartoleiros-brothers','Accept':'application/json'}});
            const text = await res.text();
            if (!res.ok || !text.trim()) throw new Error(`HTTP ${res.status} ou resposta vazia`);
            const json = JSON.parse(text);
            if (typeof json.pontos !== 'number') throw new Error('JSON recebido, mas sem campo pontos numérico');
            console.log(`API alternativa OK: ${team.nome}, rodada ${rodada}, ${json.pontos} pontos`);
          } catch (err) {
            console.error('API alternativa falhou:', err.message);
            process.exit(1);
          }
          NODE
      - name: Buscar dados do Cartola
        run: node scripts/atualizar.mjs
      - name: Integrar dados ao site
        run: node scripts/integrar-site.mjs
      - name: Atualizar confrontos e classificação
        run: node scripts/confrontos.mjs
      - name: Validar estrutura dos dados coletados
        run: node scripts/validar.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "cartola-bot"
          git config user.email "cartola-bot@users.noreply.github.com"
          git add data/liga.json docs/data.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do Cartola" && git push)
