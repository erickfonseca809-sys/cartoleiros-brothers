name: Atualizar dados do Cartola

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testar fonte alternativa de pontuação (KartolaFC)
        run: |
          node -e "const fs=require('fs'); const teams=JSON.parse(fs.readFileSync('times.json')); console.log('Times configurados:', teams.times.length); console.log('Teste de fonte alternativa será feito na coleta por time/rodada ativa.');"
      - name: Buscar dados do Cartola
        run: node scripts/atualizar.mjs
      - name: Integrar dados ao site
        run: node scripts/integrar-site.mjs
      - name: Atualizar confrontos e classificação
        run: node scripts/confrontos.mjs
      - name: Validar estrutura dos dados coletados
        run: node scripts/validar.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "cartola-bot"
          git config user.email "cartola-bot@users.noreply.github.com"
          git add data/liga.json docs/data.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do Cartola" && git push)
