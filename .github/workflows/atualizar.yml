name: Atualizar dados do Cartola

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/atualizar.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnosticar API oficial de parciais
        run: |
          node --input-type=module <<'NODE'
          const headers = {'User-Agent':'Mozilla/5.0 (compatible; cartoleiros-brothers)','Accept':'application/json'};
          for (const url of [
            'https://api.cartola.globo.com/mercado/status',
            'https://api.cartola.globo.com/atletas/pontuados',
            'https://api.cartola.globo.com/atletas/pontuados/36'
          ]) {
            try {
              const res = await fetch(url,{headers});
              const body = await res.text();
              console.log('URL:',url,'HTTP:',res.status,'Bytes:',body.length);
              if (res.ok && body.trim()) {
                try {
                  const j=JSON.parse(body);
                  console.log('JSON keys:',Object.keys(j));
                  const athletes=j.atletas;
                  if (athletes && typeof athletes==='object') {
                    const first=Object.entries(athletes)[0];
                    console.log('Atletas count:',Object.keys(athletes).length,'Sample:',first);
                  } else console.log('Sample response:',body.slice(0,700));
                } catch { console.log('Body preview:',body.slice(0,400)); }
              }
            } catch(e) { console.log('Fetch error:',e.message); }
          }
          NODE
      - name: Buscar dados do Cartola
        run: node scripts/atualizar.mjs
      - name: Integrar dados ao site
        run: node scripts/integrar-site.mjs
      - name: Atualizar confrontos e classificação
        run: node scripts/confrontos.mjs
      - name: Validar estrutura dos dados coletados
        run: node scripts/validar.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "cartola-bot"
          git config user.email "cartola-bot@users.noreply.github.com"
          git add data/liga.json docs/data.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do Cartola" && git push)
